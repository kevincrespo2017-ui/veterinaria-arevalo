# Veterinaria Arevalo - configuracion base (sin secretos)
spring.application.name=veterinaria
server.port=${PORT:8080}

# PostgreSQL. En local se puede sobrescribir con application-local.properties.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veterinaria_mejorada_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA: update agrega las columnas nuevas sin borrar las tablas existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Spring Security basico deshabilitado: la API usa JWT propio.
spring.security.user.name=${SPRING_SECURITY_USER_NAME:disabled}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:disabled}

# SMTP. En local prevalecen las propiedades de application-local.properties.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Configuracion privada local, nunca subir este archivo a Git.
spring.config.import=optional:file:./application-local.properties

# JWT: definir JWT_SECRET o app.jwt.secret en el archivo local.
# La clave debe ser Base64 y contener al menos 32 bytes aleatorios.
app.jwt.secret=${JWT_SECRET:}

# Seguridad de codigos de correo.
app.auth.verification-expiration-minutes=${AUTH_VERIFICATION_EXPIRATION_MINUTES:15}
app.auth.reset-expiration-minutes=${AUTH_RESET_EXPIRATION_MINUTES:10}
app.auth.resend-cooldown-seconds=${AUTH_RESEND_COOLDOWN_SECONDS:60}
app.auth.reset-max-attempts=${AUTH_RESET_MAX_ATTEMPTS:5}

# Creacion inicial opcional de administrador. Deshabilitada por defecto.
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Asistente IA (OpenAI). La clave solo vive en el backend.
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Gmail API se desactiva por defecto en local. Para usarla, su refresh token
# debe pertenecer a la misma cuenta indicada en spring.mail.username.
GMAIL_API_ENABLED=${GMAIL_API_ENABLED:false}
